server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flywheelstrategy.xyz;

    ssl_certificate /etc/letsencrypt/live/flywheelstrategy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flywheelstrategy.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.flywheelstrategy.xyz;

    ssl_certificate /etc/letsencrypt/live/flywheelstrategy.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flywheelstrategy.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://flywheelstrategy.xyz$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name flywheelstrategy.xyz www.flywheelstrategy.xyz;

    return 301 https://flywheelstrategy.xyz$request_uri;
}
