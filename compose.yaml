x-app: &app
  build:
    context: .
    args:
      VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID:-}
  image: mstr-system:local
  restart: unless-stopped
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./data:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *app
    command: npm run web:serve
    env_file:
      - .env.web
    environment:
      PORT: 8787
      PUBLIC_DATA_ROOT: /app/data/public
      CONTROL_DATA_ROOT: /app/data/control
      ADMIN_OWNER_ADDRESS: "0xfB8199AA97913c0494A600B725C634527dD47fa4"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  reward-keeper:
    <<: *app
    command: npm run keeper:rewards
    env_file:
      - .env.server
      - .env.reward-keeper

  reward-publisher:
    <<: *app
    command: npm run keeper:publisher
    env_file:
      - .env.server
      - .env.reward-publisher
    environment:
      PUBLIC_SNAPSHOT_DIR: /app/data/public/snapshots
      REWARD_STATE_PATH: /app/data/reward-state.json

  governance-keeper:
    <<: *app
    command: npm run keeper:governance
    env_file:
      - .env.server
      - .env.governance-keeper

  launch-watcher:
    <<: *app
    restart: "no"
    command: npm run keeper:launch-watcher
    env_file:
      - .env.server
      - .env.governance-keeper
    environment:
      CONTROL_DATA_ROOT: /app/data/control
      PUBLIC_DATA_ROOT: /app/data/public
