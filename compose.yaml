x-app: &app
  build:
    context: .
    args:
      VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID:-}
  image: flywheel-strategy-solana:local
  restart: unless-stopped
  user: "1000:1000"
  security_opt:
    - no-new-privileges:true
  volumes:
    - ./data:/app/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *app
    command: npm run web:serve
    volumes:
      - ./data/public:/app/data/public:ro
      - ./data/control/solana-requests:/app/data/control/solana-requests
      - ./data/control/solana-status-visible:/app/data/control/solana-status-visible:ro
    env_file:
      - .env.web
    environment:
      PORT: 8787
      PUBLIC_DATA_ROOT: /app/data/public
      CONTROL_DATA_ROOT: /app/data/control
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  solana-control-runner:
    <<: *app
    profiles: ["staging-automation"]
    command: npm run solana:control-runner
    env_file:
      - .env.solana
    environment:
      PUBLIC_DATA_ROOT: /app/data/public
      CONTROL_DATA_ROOT: /app/data/control
      SOLANA_STATE_ROOT: /app/data/solana
    volumes:
      - ./data:/app/data
      - ./.secrets/solana:/run/secrets/solana:ro

  solana-holder-indexer:
    <<: *app
    profiles: ["staging-automation"]
    command: npm run solana:holder-indexer
    env_file:
      - .env.solana
    environment:
      PUBLIC_DATA_ROOT: /app/data/public
      SOLANA_STATE_ROOT: /app/data/solana
    volumes:
      - ./data:/app/data
